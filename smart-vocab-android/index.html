<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Smart Vocab</title>
<meta name="description" content="망각 곡선 기반 영단어 복습장 (오프라인 동작)">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root {
  --bg: #f6f7f9; --surface: #ffffff; --surface-2: #eef0f3; --border: #e1e4e8;
  --text: #1c1f24; --text-2: #5b626c; --text-3: #8a919b;
  --accent: #2563eb; --accent-ink: #ffffff; --accent-soft: #e6eefc;
  --good: #15803d; --good-soft: #e3f4e8; --bad: #c2410c; --bad-soft: #fcebe2;
  --relearn: #7c3aed; --relearn-soft: #efe8fd; --due: #b45309; --due-soft: #fdf1df;
  --radius: 14px; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14161a; --surface: #1d2025; --surface-2: #262a31; --border: #30353d;
    --text: #e8eaed; --text-2: #a9b0ba; --text-3: #7b838e;
    --accent: #5b8def; --accent-ink: #0d1320; --accent-soft: #1f2b44;
    --good: #4ade80; --good-soft: #17301f; --bad: #fb923c; --bad-soft: #3a2316;
    --relearn: #a78bfa; --relearn-soft: #2a2242; --due: #fbbf24; --due-soft: #3a2e12;
    --shadow: none; color-scheme: dark;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font: 16px/1.5 system-ui, -apple-system, "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  -webkit-text-size-adjust: 100%; overscroll-behavior-y: none;
}
button, input, select { font: inherit; color: inherit; }
#app {
  max-width: 560px; margin: 0 auto; min-height: 100dvh;
  padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 16px);
  display: flex; flex-direction: column;
}

/* 상단 바 */
.topbar { display: flex; align-items: center; gap: 8px; min-height: 44px; margin-bottom: 8px; }
.topbar h1 { font-size: 18px; margin: 0; flex: 1; font-weight: 700; }
.icon-btn {
  border: 0; background: transparent; min-width: 44px; height: 44px; border-radius: 12px;
  display: inline-flex; align-items: center; justify-content: center; font-size: 15px; color: var(--text-2); padding: 0 10px;
}
.icon-btn:active { background: var(--surface-2); }

/* 홈 */
.brand { display: flex; align-items: baseline; gap: 8px; margin: 8px 0 16px; }
.brand h1 { font-size: 26px; margin: 0; letter-spacing: -0.02em; }
.brand small { color: var(--text-3); font-size: 13px; }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.stat {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 12px 14px; box-shadow: var(--shadow);
}
.stat .n { font-size: 26px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat .l { font-size: 13px; color: var(--text-2); }
.stat.hero { grid-column: span 2; display: flex; align-items: center; justify-content: space-between; background: var(--due-soft); border-color: transparent; }
.stat.hero .n { font-size: 34px; color: var(--due); }
.stat.hero .l { color: var(--due); font-weight: 600; }
.stat.relearn .n { color: var(--relearn); }
.stat.new .n { color: var(--good); }
.stat.wrong .n { color: var(--bad); }
.mini-stats { display: flex; justify-content: space-between; color: var(--text-2); font-size: 13px; margin-top: 10px; padding: 0 4px; }

.section-label { font-size: 13px; color: var(--text-3); font-weight: 600; margin: 22px 4px 8px; }
.stepper { display: flex; align-items: center; justify-content: space-between; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 6px 6px 6px 14px; }
.stepper .ctl { display: flex; align-items: center; gap: 4px; }
.stepper input { width: 64px; text-align: center; border: 0; background: var(--surface-2); border-radius: 10px; height: 40px; font-size: 18px; font-weight: 600; }
.stepper button { width: 44px; height: 44px; border-radius: 10px; border: 0; background: transparent; font-size: 22px; color: var(--accent); }
.stepper button:active { background: var(--surface-2); }
.hint { font-size: 12px; color: var(--accent); }

.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
  min-height: 52px; border-radius: var(--radius); border: 1px solid var(--border);
  background: var(--surface); font-size: 16px; font-weight: 600; padding: 10px 16px; box-shadow: var(--shadow);
}
.btn:active { transform: scale(.985); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.soft { background: var(--accent-soft); color: var(--accent); border-color: transparent; box-shadow: none; }
.btn.danger { color: var(--bad); }
.btn.small { min-height: 44px; font-size: 15px; }
.btn:disabled { opacity: .45; }
.stack { display: grid; gap: 10px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn .sub { font-weight: 400; font-size: 13px; opacity: .8; }

.notice { margin-top: 14px; padding: 10px 14px; border-radius: 12px; font-size: 13px; background: var(--surface-2); color: var(--text-2); display: flex; gap: 8px; align-items: center; }
.notice.warn { background: var(--bad-soft); color: var(--bad); }
.notice button { margin-left: auto; border: 0; background: transparent; color: inherit; font-weight: 700; text-decoration: underline; padding: 6px; }

/* 테스트 */
.progress { height: 4px; background: var(--surface-2); border-radius: 4px; overflow: hidden; flex: 1; }
.progress > i { display: block; height: 100%; background: var(--accent); transition: width .2s; }
.counter { font-size: 13px; color: var(--text-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.practice-tag { font-size: 12px; color: var(--relearn); background: var(--relearn-soft); padding: 2px 8px; border-radius: 99px; }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 20px; box-shadow: var(--shadow);
  padding: 28px 20px; text-align: center; margin-top: 12px;
}
.word { font-weight: 800; letter-spacing: -0.01em; color: var(--accent); word-break: break-word; line-height: 1.15; }
.word-meta { margin-top: 10px; font-size: 12px; color: var(--text-3); }
.answer-input {
  width: 100%; height: 56px; margin-top: 16px; border-radius: var(--radius); border: 1.5px solid var(--border);
  background: var(--surface); padding: 0 16px; font-size: 20px; text-align: center; outline: none;
}
.answer-input:focus { border-color: var(--accent); }
.compare { text-align: left; margin-top: 14px; }
.compare .k { font-size: 12px; color: var(--text-3); }
.compare .mine { font-size: 18px; color: var(--text-2); margin-bottom: 14px; word-break: break-word; }
.compare .real { font-size: 26px; font-weight: 700; color: var(--due); word-break: break-word; line-height: 1.3; }
.judge { position: sticky; bottom: 0; margin-top: auto; padding-top: 16px; background: linear-gradient(transparent, var(--bg) 30%); }
.judge .row2 .btn { min-height: 64px; font-size: 18px; }
.btn.ok { background: var(--good); color: #fff; border-color: transparent; }
.btn.no { background: var(--bad); color: #fff; border-color: transparent; }
@media (prefers-color-scheme: dark) { .btn.ok, .btn.no { color: #111; } }
.kbd-hint { text-align: center; font-size: 12px; color: var(--text-3); margin-top: 8px; }
@media (pointer: coarse) { .kbd-hint { display: none; } }

/* 결과 */
.score { text-align: center; margin: 24px 0 8px; }
.score .big { font-size: 52px; font-weight: 800; font-variant-numeric: tabular-nums; }
.score .big span { color: var(--text-3); font-size: 28px; font-weight: 600; }
.score .cap { color: var(--text-2); font-size: 14px; }

/* 목록 */
.search { display: flex; gap: 8px; margin-bottom: 10px; }
.search input, .search select {
  height: 44px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); padding: 0 12px;
}
.search input { flex: 1; min-width: 0; }
.list { display: grid; gap: 8px; }
.item {
  display: block; width: 100%; text-align: left; border: 1px solid var(--border); background: var(--surface);
  border-radius: 12px; padding: 10px 14px;
}
.item:active { background: var(--surface-2); }
.item .top { display: flex; align-items: center; gap: 8px; }
.item .w { font-weight: 700; font-size: 16px; word-break: break-word; }
.item .m { color: var(--text-2); font-size: 14px; margin-top: 2px; word-break: break-word; }
.item .meta { color: var(--text-3); font-size: 12px; margin-top: 4px; font-variant-numeric: tabular-nums; }
.badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); color: var(--text-2); white-space: nowrap; }
.badge.relearn { background: var(--relearn-soft); color: var(--relearn); }
.badge.new { background: var(--good-soft); color: var(--good); }
.badge.due { background: var(--due-soft); color: var(--due); }
.badge.focus { background: var(--bad-soft); color: var(--bad); }
.empty { text-align: center; color: var(--text-3); padding: 40px 0; }
.wrong-list .item { cursor: default; }

/* 시트 / 대화상자 */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: flex-end; justify-content: center; z-index: 50; animation: fade .15s; }
.overlay.center { align-items: center; padding: 16px; }
.sheet {
  width: 100%; max-width: 560px; background: var(--surface); border-radius: 20px 20px 0 0;
  padding: 18px 16px calc(env(safe-area-inset-bottom) + 16px); max-height: 92dvh; overflow: auto; animation: up .18s ease-out;
}
.dialog { width: 100%; max-width: 360px; background: var(--surface); border-radius: 18px; padding: 20px 18px 14px; animation: pop .15s; }
.dialog h2, .sheet h2 { font-size: 17px; margin: 0 0 8px; }
.dialog p { margin: 0 0 16px; color: var(--text-2); white-space: pre-line; font-size: 15px; }
.dialog .actions { display: grid; gap: 8px; }
.field { display: block; margin-bottom: 12px; }
.field span { display: block; font-size: 13px; color: var(--text-2); margin-bottom: 4px; }
.field input { width: 100%; height: 48px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--bg); padding: 0 14px; font-size: 17px; outline: none; }
.field input:focus { border-color: var(--accent); }
.field textarea { width: 100%; min-height: 64px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--bg); padding: 10px 14px; font: inherit; font-size: 16px; line-height: 1.4; resize: vertical; outline: none; }
.field textarea:focus { border-color: var(--accent); }
.detail { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 4px 0 14px; }
.detail div { background: var(--surface-2); border-radius: 10px; padding: 8px; text-align: center; }
.detail b { display: block; font-size: 15px; font-variant-numeric: tabular-nums; }
.detail small { font-size: 11px; color: var(--text-3); }
@keyframes up { from { transform: translateY(30px); opacity: 0; } }
@keyframes pop { from { transform: scale(.96); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }

.toast {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 96px); transform: translateX(-50%);
  background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 60;
  max-width: calc(100% - 32px); animation: pop .15s;
}
.update-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 70; background: var(--accent); color: var(--accent-ink); padding: calc(env(safe-area-inset-top) + 8px) 16px 8px; display: flex; align-items: center; gap: 8px; font-size: 14px; }
.update-bar button { margin-left: auto; border: 0; border-radius: 8px; padding: 6px 12px; background: var(--accent-ink); color: var(--accent); font-weight: 700; }
.data-info { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; font-size: 14px; color: var(--text-2); }
.data-info b { color: var(--text); }
.desc { font-size: 13px; color: var(--text-3); margin: 6px 4px 0; }
.extras { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--border); display: grid; gap: 4px; font-size: 14px; color: var(--text-2); word-break: break-word; }
.extras .exk { display: inline-block; min-width: 44px; margin-right: 6px; font-size: 12px; font-weight: 600; color: var(--text-3); }
.example { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--border); word-break: break-word; }
.example .ex-en { font-size: 15px; line-height: 1.45; color: var(--text); }
.example .ex-en b { color: var(--accent); font-weight: 700; }
.example .ex-ko { margin-top: 4px; font-size: 13px; line-height: 1.45; color: var(--text-3); }
.meta b { color: var(--text-2); }
details.more { margin-bottom: 12px; }
details.more summary { cursor: pointer; font-size: 14px; color: var(--accent); padding: 6px 0 10px; }
.field small { color: var(--text-3); font-weight: 400; }
.paste-box { width: 100%; min-height: 46dvh; border-radius: var(--radius); border: 1.5px solid var(--border); background: var(--surface); padding: 12px; font: 13px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace; resize: vertical; outline: none; }
.paste-box:focus { border-color: var(--accent); }
.prow .pcheck { display: flex; align-items: center; gap: 8px; min-height: 32px; }
.prow .pcheck input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
.pmean { width: 100%; height: 40px; margin-top: 6px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); padding: 0 10px; font-size: 15px; outline: none; }
.pmean:focus { border-color: var(--accent); }
.prow.dim { opacity: .55; }
.tag { display: inline-block; font-size: 10px; font-weight: 700; color: var(--text-3); background: var(--surface-2); border-radius: 4px; padding: 0 4px; margin-right: 4px; }
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<noscript>이 앱은 JavaScript가 필요합니다.</noscript>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
